<style>
h1 {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 32px;
    font-weight: 500;
}
form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}
form label.upload {
    display: flex;
    border-radius: 30px;
    border: 2px solid hsl(0, 0%, 40%);
    background-color: hsl(0, 0%, 84%);
    padding: 14px;

    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 18px;
    font-weight: 400;

    width: 480px;
    height: 360px;
}
form label.upload:hover {
    cursor: pointer;
    background-color: hsl(0, 0%, 81%);
}
form label.upload p {
    margin: 0px;
}
#thumbnail-preview {
    width: 480px;
    height: 360px;
}
#video-preview {
    width: 480px;
    height: 360px;
}
form label.text {
    display: flex;
    flex-direction: column;
    gap: 10px;

    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 20px;
    font-weight: 500;
}
</style>
<h1>Make</h1>
<form id="upload">
    <label class="upload">
        <p>Upload Thumbnail..</p>
        <input type="file" accept="image/*" name="thumbnail" style="display: none" required>
        <img id="thumbnail-preview" style="display: none;">
    </label>
    <label class="upload">
        <p>Upload Video..</p>
        <input type="file" accept="video/*" name="video" style="display: none" required>
        <video id="video-preview" style="display: none;"></video>
    </label>
    <label class="text">
        Title:
        <input type="text" name="title" maxlength="100" required>
    </label>
    <label class="text">
        Description:
        <textarea type="text" name="description" maxlength="1000"></textarea>
    </label>
    <button>Upload</button>
</form>
<script>
const thumbnailUploadInput = document.querySelector("label input[name=thumbnail]"), thumbnailUploadText = thumbnailUploadInput.previousSibling.previousSibling, thumbnailPreviewElement = thumbnailUploadInput.nextSibling.nextSibling,
videoUploadInput = document.querySelector("label input[name=video]"), videoUploadText = videoUploadInput.previousSibling.previousSibling, videoPreviewElement = videoUploadInput.nextSibling.nextSibling;
console.log(thumbnailUploadText);

thumbnailUploadInput.onchange = async () => {
    if (thumbnailUploadInput.files.length !== 0) {
        const file = thumbnailUploadInput.files[0];
        thumbnailUploadText.style.display = "none";
        thumbnailPreviewElement.style.display = "";
        thumbnailPreviewElement.src = "data:" + file.type + ";base64," + (await file.bytes()).toBase64();
    } else {
        thumbnailUploadText.style.display = "";
        thumbnailPreviewElement.style.display = "none";
    }
}

videoUploadInput.onchange = async () => {
    if (videoUploadInput.files.length !== 0) {
        const file = videoUploadInput.files[0];
        videoUploadText.style.display = "none";
        videoPreviewElement.style.display = "";
        videoPreviewElement.src = "data:" + file.tyoe + ";base64," + (await file.bytes()).toBase64();
    } else {
        videoUploadText.style.display = "";
        videoPreviewElement.style.display = "none";
    }
}
</script>
