<style>
h1 {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 32px;
    font-weight: 500;
}
#videos {
    display: grid;
    grid-template-columns: repeat(auto-fill, 520px);
    grid-template-rows: auto;
    gap: 20px;
    justify-content: space-around;
}
.video {
    background-color: hsl(0, 0%, 70%);
    border-radius: 20px;
    height: fit-content;
    width: fit-content;
    padding: 20px;
}
.image {
    border-radius: 20px;
    overflow: hidden;
    width: 480px;
    height: 360px;
}
.image:hover {
    cursor: pointer;
}
.image img {
    width: 480px;
    height: 360px;

    user-select: none;
    -ms-user-select: none;
    -moz-user-select: none;
    -webkit-user-select: none;
}
.lower {
    margin-top: 30px;
}
.title, .description, .date {
    margin: 0px;

    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}
</style>
<h1>Home</h1>
<div id="videos">
    <div class="video" th:each="video : ${videos}" th:object="${video}">
        <div class="image" th:data-link="*{link}">
            <img th:src="|*{thumbnail}|">
        </div>
        <div class="lower">
            <h2 class="title" th:text="*{title}"></h2>
            <p class="description" th:text="*{description}">Description here</p>
            <p class="date" th:text="*{date}"></p>
        </div>
    </div>
    <script>
        const videos = document.querySelectorAll(".video .image");
        videos.forEach(video => video.addEventListener("click", () => redirect(video.getAttribute("data-link"))));
        function redirect(link) {
            window.location.href = window.location.protocol + "//" + window.location.host + link;
        }
    </script>
</div>
