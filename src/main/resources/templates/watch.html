<style>
#video-view {
    display: flex;
    flex-direction: column;
    background-color: hsl(0, 0%, 80%);
    border-radius: 20px;
}
#video {
    display: grid;
    grid-template-columns: repeat(auto-fill, 520px);
    grid-template-rows: auto;
    gap: 20px;
    justify-content: space-around;
}
#controls {
    padding: 15px;
}
#play {

}
#play svg {
    width: 20px;
    height: 20px;
}
#play #pause-icon {
    display: none;
}
#play #play-icon {
    display: flex;
}
#video:playing + div #play #pause-icon {
    display: flex;
}
#video:playing + div #play #play-icon {
    display: none;
}
#pos {

}
#time {
    display: inline-flex;
    margin: 0px;
}
#volume {
    writing-mode: vertical-lr;
    direction: rtl;
    display: inline-flex;
}
</style>
<div id="video-view">
    <video id="video" th:src="|/api/video/show/${id}|" type="video/mp4" autoplay></video>
    <div id="controls">
        <button id="play" onclick="play();">
            <!-- SVG icons sourced from https://www.svgrepo.com/collection/minimal-ui-icons/27 -->

            <!-- Pause Icon -->
            <svg id="pause-icon" width="800px" height="800px" viewBox="-1 0 8 8" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                <g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                    <g id="Dribbble-Light-Preview" transform="translate(-227.000000, -3765.000000)" fill="#000000">
                        <g id="icons" transform="translate(56.000000, 160.000000)">
                            <path d="M172,3605 C171.448,3605 171,3605.448 171,3606 L171,3612 C171,3612.552 171.448,3613 172,3613 C172.552,3613 173,3612.552 173,3612 L173,3606 C173,3605.448 172.552,3605 172,3605 M177,3606 L177,3612 C177,3612.552 176.552,3613 176,3613 C175.448,3613 175,3612.552 175,3612 L175,3606 C175,3605.448 175.448,3605 176,3605 C176.552,3605 177,3605.448 177,3606" id="pause-[#1006]"></path>
                        </g>
                    </g>
                </g>
            </svg>

            <!-- Play Icon -->
            <svg id="play-icon" width="800px" height="800px" viewBox="-0.5 0 7 7" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                <g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                    <g id="Dribbble-Light-Preview" transform="translate(-347.000000, -3766.000000)" fill="#000000">
                        <g id="icons" transform="translate(56.000000, 160.000000)">
                            <path d="M296.494737,3608.57322 L292.500752,3606.14219 C291.83208,3605.73542 291,3606.25002 291,3607.06891 L291,3611.93095 C291,3612.7509 291.83208,3613.26444 292.500752,3612.85767 L296.494737,3610.42771 C297.168421,3610.01774 297.168421,3608.98319 296.494737,3608.57322" id="play-[#1003]"></path>
                        </g>
                    </g>
                </g>
            </svg>
        </button>
        <input id="pos" type="range">
        <p id="time">10:00 / 10:00</p>
        <div id="volume">
            <button onclick="openVolume();">🔇</button>
            <input type="range" style="display: none;">
        </div>
    </div>
</div>
<script>
const /** @type {HTMLVideoElement} */ videoElement = document.getElementById("video");
function play() {
    if (videoElement.paused) videoElement.play();
    else videoElement.pause();
}
videoElement.addEventListener("click", play);

const /** @type {HTMLButtonElement} */ volumeDisplayElement = document.querySelector("#volume button"), /** @type {HTMLInputElement} */ volumeInputElement = document.querySelector("#volume input"), volumePreset = Number.parseInt(localStorage.getItem("volume")) || 50;
volumeDisplayElement.innerText = volumePreset === 0 ? "🔇" : "🔈";
videoElement.volume = volumePreset / 100;
function openVolume() {
    volumeInputElement.style.display = volumeInputElement.style.display === "none" ? "flex" : "none";
}
volumeInputElement.value = volumePreset;
volumeInputElement.oninput = () => {
    const /** @type {number} */ newVolume = volumeInputElement.valueAsNumber;
    volumeDisplayElement.innerText = newVolume === 0 ? "🔇" : "🔈";
    videoElement.volume = Math.min(100, Math.max(0, newVolume)) / 100;
    localStorage.setItem("volume", newVolume.toString());
}
</script>
