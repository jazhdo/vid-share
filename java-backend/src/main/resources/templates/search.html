<style>
#header {
    margin: 0px;
    margin-bottom: 40px;
}
.results {
    display: flex;
    flex-direction: column;
    padding: 20px;
}
.result {
    display: flex;
    padding: 10px;
    border-radius: 28px;
    height: fit-content;
    background-color: hsl(0, 0%, 80%);
}
.top {
    display: flex;
    flex-direction: column;
}
.pfp {
    border-radius: 100px;
    height: 35px;
    width: 35px;
}
.bottom {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
}
</style>
<link rel="stylesheet" href="/css/video">
<h1 id="header" th:text="|Search Results for '${search.query}'|">Search Results for </h1>
<div id="results">
    <!-- Repeat this for each result -->
    <div class="result" th:each="result : ${results}" th:object="${result}">
        <img class="thumbnail" th:src="|${result.thumbnail}|" th:data-link="*{link}" onclick="window.location.href = this.getAttribute('data-link')">
        <div style="display: flex; flex-direction: column; margin: 0px 40px; justify-content: space-between; width: 100%">
            <div class="top">
                <h2 th:text="*{title}">Video Title</h2>
                <p th:text="*{description}">Video Description</p>
                <div class="author" th:data-username="*{username}" onclick="window.location.href = '/@' + this.getAttribute('data-username')">
                    <img th:src="|/api/pfp/*{uid}|">
                    <p th:text="|@*{displayname}|">John Doe</p>
                </div>
            </div>
            <div class="bottom">
                <!-- Left -->
                <p th:text="|Views: *{views} - Likes: *{likes} - Comments: *{comments}|">Views: 1M | Likes: 100k | Comments: 100k</p>
                
                <!-- Right -->
                <p th:text="|Date: *{date}|">Date: MM/DD/YYYY</p>
            </div>
        </div>
    </div>
</div>
