<style>
h1 {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 32px;
    font-weight: 500;
}
#videos {
    display: grid;
    grid-template-columns: repeat(auto-fill, 520px);
    grid-template-rows: auto;
    gap: 20px;
    justify-content: space-around;
}
.video {
    background-color: hsl(0, 0%, 80%);
    border-radius: 37px;
    height: fit-content;
    width: fit-content;
    padding: 20px;
}
.lower {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.title, .description, .date {
    margin: 0px;
}
</style>
<link rel="stylesheet" href="/css/video">
<h1>Home</h1>
<div id="videos">
    <div class="video" th:each="video : ${videos}" th:object="${video}">
        <img class="thumbnail" th:src="|*{thumbnail}|" th:data-link="*{link}" onclick="window.location.href = this.getAttribute('data-link')"></img>
        <div class="lower">
            <h2 class="title" th:text="*{title}"></h2>
            <p class="description" th:text="*{description}">Description here</p>
            <div class="author" th:data-username="*{username}" onclick="window.location.href = '/@' + this.getAttribute('data-username')">
                <img th:src="|/api/pfp/*{uid}|">
                <p th:text="|@*{displayname}|"></p>
            </div>
            <p class="date" th:text="*{date}"></p>
        </div>
    </div>
</div>
