<style>
#main {
    justify-content: center;
    align-items: center;
}
#window {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: hsl(0, 0%, 88%);
    border-radius: 50px;
    padding: 20px;
    width: 400px;
    height: 400px;
}
#title {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    margin-top: 0px;
}
form {
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 320px;
}
form h2 {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 20px;
    font-weight: 500;
    width: 100%;
    margin: 0px;
}
form input {
    width: 230px;
    margin-left: 15px;
    height: 20px;
    font-size: 16px;
    border-radius: 100px;
    border: 1.5px solid black;
    padding: 3px;
    padding-left: 3px;
    padding-left: 8px;
}
form label {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    margin-bottom: 10px;
}
form button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    border: 1px solid hsl(0, 0%, 10%);
    border-radius: 100px;
    padding: 0px;
    background-color: white;
    width: 57px;
    height: 29px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 16px;
    font-weight: 400;
    padding: 11px;
    user-select: none;
    -ms-user-select: none;
    -moz-user-select: none;
    -webkit-user-select: none;
}
form button:hover {
    background-color: hsl(0, 0%, 94%);
    cursor: pointer;
}
#error-display {
    color: red;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 18px;
    font-weight: 500;
    margin: 7px;
}
button.regular {
    display: flex;
    justify-content: center;
    align-items: center;
    align-self: center;
    border: 1px solid hsl(0, 0%, 10%);
    border-radius: 100px;
    padding: 0px;
    background-color: white;
    width: 320px;
    height: 45px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-size: 18px;
    font-weight: 400;
    margin: 7px;
    user-select: none;
    -ms-user-select: none;
    -moz-user-select: none;
    -webkit-user-select: none;
}
button.regular:hover {
    cursor: pointer;
    background-color: hsl(0, 0%, 94%);
}
</style>
<div id="window">
    <h1 id="title">Sign In</h1>
    <form id="login-form">
        <h2>Username:</h2>
        <input name="username" maxlength="30">
        <h2>Password:</h2>
        <label>
            <input name="password" type="password" maxlength="100">
            <button onclick="showPassword(this);" type="button">Show</button>
        </label>
        <p id="error-display" style="display: none;"></p>
        <button class="regular" type="submit">Sign In</button>
    </form>
    <button class="regular" onclick="switchMethod(this);">New? Sign up here</button>
</div>
<script src="/js/login"></script>
